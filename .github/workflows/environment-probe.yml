name: environment-probe
on:
  push:
    paths: ['.github/workflows/environment-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check published package versions
        run: |
          mkdir -p artifacts/ci
          node --input-type=module <<'JS' > artifacts/ci/environment.json
          import { execFileSync } from 'node:child_process';
          const packages=['langchain','@langchain/core','@langchain/langgraph','@langchain/langgraph-checkpoint-postgres','@langchain/openai','@modelcontextprotocol/server','@modelcontextprotocol/client','@nestjs/core','nuxt'];
          const result={node:process.version,packages:{}};
          for(const name of packages){try{result.packages[name]=JSON.parse(execFileSync('npm',['view',name,'version','--json'],{encoding:'utf8',timeout:45000}));}catch(e){result.packages[name]={error:String(e.message).slice(0,500)};}}
          console.log(JSON.stringify(result,null,2));
          JS
      - name: Preserve diagnostic result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/ci/environment.json
          git commit -m 'test: record actual npm and Node environment' || true
          git push origin HEAD:main
