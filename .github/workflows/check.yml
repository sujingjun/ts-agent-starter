name: full-stack-check
on:
  push:
    branches: [main]
    paths: ['src/**', 'apps/**', 'integrations/**', 'scripts/**', 'tests/**', 'evals/**', 'skills/**', 'data/**', 'infra/**', 'docs/**', 'package*.json', 'tsconfig*.json', '.github/workflows/check.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: agents
          POSTGRES_DB: agents
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agents -d agents"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      MODEL_MODE: demo
      CHECKPOINT_MODE: memory
      DATABASE_URL: postgresql://agents:test-only-password@127.0.0.1:5432/agents
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Independently validate all required capabilities
        id: checks
        continue-on-error: true
        run: node scripts/ci-verify.mjs
      - name: Record actual results and dependency lock
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          node scripts/make-manifest.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in package-lock.json FILE-MANIFEST.json REMOTE-VALIDATION.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if [ -d artifacts/ci ]; then git add -f artifacts/ci; fi
          if [ -d dist-core ]; then git add -f dist-core; fi
          git diff --cached --quiet || git commit -m 'test: record actual full-stack validation and lock dependencies'
          git push origin HEAD:main
      - name: Create source archive
        if: always()
        run: git archive --format=zip --prefix=ts-agent-starter/ -o /tmp/TS-Agent-Starter-v0.2.0.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-and-validation
          path: |
            /tmp/TS-Agent-Starter-v0.2.0.zip
            artifacts/ci/
            artifacts/browser/
            REMOTE-VALIDATION.json
      - name: Fail when any required check failed
        if: always()
        run: test '${{ steps.checks.outcome }}' = success
